<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- تأثير توهج ناعم جداً للقوس الذهبي (يظهر فقط في الثيم الداكن) -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="var(--rating-star, #eab308)" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. الطبقة الأساسية: خلفية زجاجية ناعمة (تستخدم في الثيم الفاتح والداكن) -->
  <circle cx="60" cy="60" r="58" 
          fill="var(--glass-bg, rgba(255, 255, 255, 0.05))" 
          stroke="var(--glass-border, rgba(255, 255, 255, 0.1))" 
          stroke-width="1.5" />

  <!-- 2. الرأس (لون النصوص الخافتة - يتغير حسب الثيم) -->
  <circle cx="60" cy="48" r="14" 
          fill="none" 
          stroke="var(--muted-foreground, #64748b)" 
          stroke-width="4" 
          stroke-linecap="round" />

  <!-- 3. الكتفين/الجسم (لون التقييم الذهبي - يتغير حسب الثيم مع تأثير توهج) -->
  <path d="M 38 78 Q 60 92 82 78" 
        fill="none" 
        stroke="var(--rating-star, #eab308)" 
        stroke-width="5" 
        stroke-linecap="round" 
        filter="url(#gold-glow)" />
</svg>